server.port=8081
spring.application.name=Usuarios

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.web=DEBUG

app.jwt.secret=${JWT_SECRET:my-super-secure-dev-secret-key-123456789}
app.jwt.expiration-ms=86400000

app.admin.nombre=${ADMIN_NAME:Admin Principal}
app.admin.email=${ADMIN_EMAIL:admin@inmobiliaria.com}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}